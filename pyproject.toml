[project]
name = "clinical-trial-matcher"
version = "0.1.0"
description = "Deterministic, explainable clinical trial prescreening over HL7 FHIR R4 and ClinicalTrials.gov API v2"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    # Newer Starlette warns that TestClient prefers a different HTTP backend; harmless for this project.
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP042"]  # (str, Enum) keeps JSON/Pydantic behaviour explicit and works on 3.11+

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
